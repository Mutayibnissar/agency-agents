name: Agency Runtime

on:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test --prefix runtime
      - run: node runtime/src/cli.mjs list
